<svg viewBox="0 0 680 380" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>LoopX 效果解释器控制循环</title>
  <desc>展示 Agent 产出效果请求，由 LoopX 内核解释后决定执行、验证、写回的完整循环</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Outer box: LoopX Kernel -->
  <rect x="30" y="20" width="620" height="350" rx="18" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/>
  <text x="340" y="48" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">LoopX Kernel 控制平面</text>

  <!-- Agent Runtime box (outside left) -->
  <rect x="20" y="120" width="130" height="70" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="85" y="148" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">Agent Runtime</text>
  <text x="85" y="166" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">Codex / Claude Code /</text>
  <text x="85" y="180" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">Cursor / Pi</text>

  <!-- Arrow: Agent→Effect Request -->
  <line x1="150" y1="155" x2="200" y2="155" stroke="#0F6E56" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Effect Request box -->
  <rect x="210" y="110" width="130" height="55" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="275" y="132" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402">Effect Request</text>
  <text x="275" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#EF9F27">效果请求（类型化）</text>

  <!-- Arrow: Effect→Quota Check -->
  <line x1="340" y1="140" x2="400" y2="140" stroke="#854F0B" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Quota Decision box -->
  <rect x="410" y="100" width="130" height="55" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="475" y="122" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#042C53">Quota Decision</text>
  <text x="475" y="140" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#378ADD">配额是否允许执行？</text>

  <!-- Arrow: Quota→Execution -->
  <line x1="475" y1="160" x2="475" y2="200" stroke="#185FA5" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Execution box -->
  <rect x="405" y="205" width="140" height="55" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="475" y="227" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#173404">Harness Execute</text>
  <text x="475" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#639922">运行有界 Agent 切片</text>

  <!-- Arrow: Execution→Validation -->
  <line x1="405" y1="232" x2="330" y2="232" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Validation box -->
  <rect x="210" y="205" width="120" height="55" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="270" y="227" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#4A1B0C">Validation</text>
  <text x="270" y="245" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#D85A30">Capability 验证</text>

  <!-- Decision diamond (success/fail) -->
  <polygon points="270,280 340,310 270,340 200,310" fill="#FBEAF0" stroke="#993556" stroke-width="0.5"/>
  <text x="270" y="307" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="500" fill="#72243E">Validated?</text>

  <!-- Writeback path (YES) -->
  <line x1="340" y1="310" x2="430" y2="310" stroke="#3B6D11" stroke-width="1.2"/>
  <text x="385" y="300" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#639922">YES</text>

  <!-- Writeback box -->
  <rect x="435" y="285" width="110" height="50" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="490" y="307" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#173404">Writeback</text>
  <text x="490" y="323" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#639922">证据写入 + 配额花费</text>

  <!-- Arrow: Writeback→Next Todo -->
  <line x1="490" y1="335" x2="490" y2="365" stroke="#3B6D11" stroke-width="1.2"/>
  <line x1="490" y1="365" x2="270" y2="365" stroke="#3B6D11" stroke-width="1.2" marker-end="url(#a)"/>

  <!-- Repair path (NO) -->
  <line x1="200" y1="310" x2="140" y2="310" stroke="#A32D2D" stroke-width="1.2"/>
  <text x="170" y="300" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#A32D2D">NO</text>

  <!-- Repair box -->
  <rect x="50" y="285" width="100" height="50" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
  <text x="100" y="307" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#501313">Repair / Replan</text>
  <text x="100" y="323" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A32D2D">回退到修复路径</text>

  <!-- Next Todo box (final node) -->
  <rect x="210" y="345" width="120" height="30" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="270" y="364" text-anchor="middle" font-family="sans-serif" font-size="11" font-weight="500" fill="#042C53">Next Todo → 下一轮</text>

  <!-- Arrow back to Agent -->
  <line x1="270" y1="365" x2="270" y2="389" stroke="#185FA5" stroke-width="1.2"/>
  <line x1="270" y1="389" x2="85" y2="389" stroke="#185FA5" stroke-width="1.2"/>
  <line x1="85" y1="389" x2="85" y2="195" stroke="#185FA5" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a)"/>
  <text x="270" y="399" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#378ADD">返回 Agent，携带 Todo + 证据 + 交接包</text>

</svg>
