<svg viewBox="0 0 680 200" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Optimizer evolution: AdamW to MoonClip</title>
  <desc>Progression from AdamW through Muon and Per-Head Muon to MoonClip</desc>
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font-family: sans-serif; font-size: 14px; font-weight: 500; }
    .ts { font-family: sans-serif; font-size: 12px; font-weight: 400; }
    .box { fill: #F1EFE8; stroke: #B4B2A9; }
  </style>
  <text class="th" x="340" y="30" text-anchor="middle" fill="#2C2C2A">优化器演进路线</text>
  <g>
    <rect x="30" y="55" width="135" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
    <text class="th" x="97" y="75" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A">AdamW</text>
    <text class="ts" x="97" y="95" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">3x mem, per-param</text>
  </g>
  <line x1="165" y1="83" x2="195" y2="83" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow1)"/>
  <g>
    <rect x="205" y="55" width="135" height="56" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
    <text class="th" x="272" y="75" text-anchor="middle" dominant-baseline="central" fill="#042C53">Muon</text>
    <text class="ts" x="272" y="95" text-anchor="middle" dominant-baseline="central" fill="#185FA5">2x mem, NS orthog</text>
  </g>
  <line x1="340" y1="83" x2="370" y2="83" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow1)"/>
  <g>
    <rect x="380" y="55" width="135" height="56" rx="8" fill="#EAF3DE" stroke="#97C459" stroke-width="0.5"/>
    <text class="th" x="447" y="75" text-anchor="middle" dominant-baseline="central" fill="#173404">Per-Head Muon</text>
    <text class="ts" x="447" y="95" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">96-head, 325x faster</text>
  </g>
  <line x1="515" y1="83" x2="545" y2="83" stroke="#888780" stroke-width="0.5" marker-end="url(#arrow1)"/>
  <g>
    <rect x="555" y="55" width="105" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
    <text class="th" x="607" y="75" text-anchor="middle" dominant-baseline="central" fill="#412402">MoonClip</text>
    <text class="ts" x="607" y="95" text-anchor="middle" dominant-baseline="central" fill="#854F0B">2x data eff.</text>
  </g>
  <text class="ts" x="340" y="145" text-anchor="middle" fill="#5F5E5A">Muon (2024) → Per-Head Muon (K3, 2025) → MoonClip (K3, 2025)</text>
  <text class="ts" x="340" y="168" text-anchor="middle" fill="#5F5E5A">核心突破：逐参数独立更新 → 矩阵级正交化 → 逐头解耦 → 二阶近似</text>
</svg>
