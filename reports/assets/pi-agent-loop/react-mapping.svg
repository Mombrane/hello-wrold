<svg viewBox="0 0 680 340" width="100%" role="img">
  <title>Pi 隐式 ReAct 架构映射</title>
  <desc>原始 ReAct 的 Thought/Action/Observation 三元组在 Pi 中的实现映射</desc>
  <defs>
    <marker id="ra" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="30" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">隐式 ReAct：Thought/Action/Observation 在 Pi 中的映射</text>

  <text x="120" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">原始 ReAct（2022，显式）</text>

  <rect x="30" y="80" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="120" y="98" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Thought: 文本片段（占 output）</text>
  <text x="120" y="113" text-anchor="middle" font-family="monospace" font-size="10" fill="#888780">"I need to check src/ first"</text>

  <line x1="120" y1="120" x2="120" y2="140" stroke="#888780" stroke-width="0.5" marker-end="url(#ra)"/>

  <rect x="30" y="140" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="120" y="158" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Action: 文本标签（需解析）</text>
  <text x="120" y="173" text-anchor="middle" font-family="monospace" font-size="10" fill="#888780">"bash[ls src/]"</text>

  <line x1="120" y1="180" x2="120" y2="200" stroke="#888780" stroke-width="0.5" marker-end="url(#ra)"/>

  <rect x="30" y="200" width="180" height="40" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="120" y="218" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#5F5E5A">Observation: 文本输出</text>
  <text x="120" y="233" text-anchor="middle" font-family="monospace" font-size="10" fill="#888780">"src/ does not exist"</text>

  <line x1="210" y1="180" x2="290" y2="130" stroke="#534AB7" stroke-width="1" marker-end="url(#ra)"/>
  <text x="250" y="150" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">映射</text>
  <line x1="210" y1="180" x2="290" y2="230" stroke="#534AB7" stroke-width="1" marker-end="url(#ra)"/>

  <text x="510" y="65" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#5F5E5A">Pi（2025-2026，隐式）</text>

  <rect x="310" y="80" width="350" height="80" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="485" y="105" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#3C3489">Thinking Token（推理）</text>
  <text x="485" y="125" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7F77DD">模型原生 thinking token，不占 output token</text>
  <text x="485" y="145" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#7F77DD">独立计费，不干扰上下文窗口</text>

  <rect x="310" y="170" width="350" height="80" rx="8" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="485" y="195" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#085041">Function Calling（行动）</text>
  <text x="485" y="215" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#1D9E75">结构化 JSON block，不需要文本解析</text>
  <text x="485" y="235" text-anchor="middle" font-family="monospace" font-size="10" fill="#1D9E75">{"type":"toolCall","name":"bash",...}</text>

  <rect x="310" y="260" width="350" height="60" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="485" y="285" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#185FA5">toolResult Message（观察）</text>
  <text x="485" y="305" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#378ADD">结构化 message 追加到 context，LLM 原生理解</text>

  <text x="120" y="275" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A32D2D">需要 Few-shot 示例引导</text>
  <text x="120" y="295" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A32D2D">Thought/Action/Observation</text>
  <text x="120" y="315" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#A32D2D">占 15-30% output token</text>

  <text x="485" y="340" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#27500A">零提示词开销，零 output 浪费</text>
</svg>