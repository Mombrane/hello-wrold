<path d="M80 259H620" fill="none" stroke="#E5E5E0" stroke-width="0.5"/>
<path d="M80 217H620" fill="none" stroke="#E5E5E0" stroke-width="0.5"/>
<path d="M80 176H620" fill="none" stroke="#E5E5E0" stroke-width="0.5"/>
