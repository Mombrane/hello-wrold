<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>四种运行时的累计 token 消耗随执行步数变化</title>
<desc>在仓库管理场景中，Prompt、Memory、Stateful 三种基线的累计 token 消耗随步数呈平方级增长，T=200 时分别达到 261 万、618 万、504 万；SKILL.state 保持线性增长，T=200 时仅 12.2 万，四条曲线在步数较小时几乎重合，差距在长程才拉开。</desc>

<text x="80" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5F5E5A">累计 token 消耗</text>

