<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 680 382" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SKILL.state 单步执行循环的数据流</title>
<desc>每步输入技能说明书、当前状态与最新观察，模型产出推理链、状态补丁和动作三件输出；状态补丁经校验后合并进新状态，动作送往环境执行，推理链被永久丢弃。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="170" y="36" width="110" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="225" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#444441" text-anchor="middle" dominant-baseline="central">P 说明书</text>
<rect x="285" y="36" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">Σt 当前状态</text>
<rect x="400" y="36" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="455" y="58" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">Ot 最新观察</text>

<path d="M225 80 V98 H338 V110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 80 V110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M455 80 V98 H342 V110" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="240" y="116" width="200" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="340" y="134" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">LLM 生成</text>
<text x="340" y="156" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">(Rt, ΔΣt, at)</text>

<path d="M340 172 V184 H145 V192" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 172 V192" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M340 172 V184 H535 V192" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="90" y="196" width="110" height="44" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="145" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#791F1F" text-anchor="middle" dominant-baseline="central">Rt 推理链</text>
<rect x="285" y="196" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">ΔΣt 状态补丁</text>
<rect x="480" y="196" width="110" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="218" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">at 动作</text>

<path d="M145 240 V250" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arrow)"/>
<rect x="80" y="256" width="130" height="60" rx="8" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
<text x="145" y="278" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#791F1F" text-anchor="middle" dominant-baseline="central">校验后立即丢弃</text>
<text x="145" y="298" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">永不进入下一轮</text>

<path d="M340 240 V252" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="285" y="256" width="110" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">校验 ΔΣt</text>
<path d="M340 292 V302" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="285" y="306" width="110" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">合并 → Σt+1</text>

<path d="M535 240 V252" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="480" y="256" width="110" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">执行动作</text>
<path d="M535 292 V302" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="480" y="306" width="110" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="324" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#085041" text-anchor="middle" dominant-baseline="central">环境 → Ot+1</text>

<text x="40" y="362" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#5F5E5A">合并后的 Σt+1 与环境新返回的 Ot+1，构成下一步的三件套输入</text>
</svg>
