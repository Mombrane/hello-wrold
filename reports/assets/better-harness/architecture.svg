<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="100%" role="img">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#A32D2D" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>better-harness 双 Agent 优化循环架构</title>
  <desc>展示外部 DeepAgent 如何通过评估反馈优化内部 Agent 的 harness 表面</desc>

  <rect x="0" y="0" width="680" height="540" fill="transparent"/>

  <rect x="40" y="40" width="600" height="220" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="60" y="68" font-family="sans-serif" font-size="14px" font-weight="500" fill="#3C3489">Better Agent (外部优化者 DeepAgent)</text>

  <rect x="60" y="90" width="120" height="48" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="120" y="114" font-family="sans-serif" font-size="14px" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">读取失败用例</text>

  <rect x="210" y="90" width="120" height="48" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="270" y="114" font-family="sans-serif" font-size="14px" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">编辑 surface 文件</text>

  <rect x="360" y="90" width="120" height="48" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="420" y="114" font-family="sans-serif" font-size="14px" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">构建候选 Variant</text>

  <rect x="510" y="90" width="110" height="48" rx="8" fill="#CECBF6" stroke="#534AB7" stroke-width="0.5"/>
  <text x="565" y="114" font-family="sans-serif" font-size="14px" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">门控决策</text>

  <line x1="180" y1="114" x2="210" y2="114" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="330" y1="114" x2="360" y2="114" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="114" x2="510" y2="114" stroke="#534AB7" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="160" width="560" height="88" rx="8" fill="transparent" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4,4"/>
  <text x="80" y="182" font-family="sans-serif" font-size="14px" font-weight="500" fill="#5F5E5A">Proposer Workspace (隔离工作区)</text>
  <text x="80" y="201" font-family="sans-serif" font-size="12px" fill="#5F5E5A">task.md · surface_manifest.json · train_failures.json · train_summary.json · train_cases/ · history/ · proposal.md · current/</text>
  <text x="80" y="218" font-family="sans-serif" font-size="12px" fill="#5F5E5A">外部 Agent 只在 /current/ 下编辑，系统将编辑转换为 candidate harness 并跑评估后再决定保留/丢弃</text>
  <text x="80" y="235" font-family="sans-serif" font-size="12px" fill="#888780">注：外部 Agent 只看到 train 失败案例，holdout 对其不可见（防过拟合）</text>

  <line x1="40" y1="280" x2="640" y2="280" stroke="#B4B2A9" stroke-width="0.5"/>

  <rect x="40" y="300" width="600" height="200" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="60" y="328" font-family="sans-serif" font-size="14px" font-weight="500" fill="#085041">Inner Agent 评估 (pytest / Harbor)</text>

  <rect x="60" y="350" width="170" height="48" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="145" y="374" font-family="sans-serif" font-size="14px" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">注入 Variant</text>

  <rect x="260" y="350" width="170" height="48" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345" y="374" font-family="sans-serif" font-size="14px" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">逐个 case 执行</text>

  <rect x="460" y="350" width="160" height="48" rx="8" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="540" y="374" font-family="sans-serif" font-size="14px" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">解析 JUnit XML</text>

  <line x1="230" y1="374" x2="260" y2="374" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <line x1="430" y1="374" x2="460" y2="374" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <rect x="60" y="420" width="150" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="135" y="438" font-family="sans-serif" font-size="12px" fill="#27500A" text-anchor="middle" dominant-baseline="central">train: 可见（优化用）</text>

  <rect x="240" y="420" width="150" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="315" y="438" font-family="sans-serif" font-size="12px" fill="#27500A" text-anchor="middle" dominant-baseline="central">holdout: 不可见（验证用）</text>

  <rect x="420" y="420" width="150" height="36" rx="8" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="495" y="438" font-family="sans-serif" font-size="12px" fill="#27500A" text-anchor="middle" dominant-baseline="central">scorecard: 仅最终对比</text>

  <path d="M 565 155 L 565 270 L 595 270 L 595 155" fill="none" stroke="#A32D2D" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <text x="605" y="215" font-family="sans-serif" font-size="12px" fill="#A32D2D">未提升</text>
  <text x="605" y="230" font-family="sans-serif" font-size="12px" fill="#A32D2D">则丢弃</text>

  <path d="M 640 490 L 660 490 L 660 30 L 640 30" fill="none" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="648" y="260" font-family="sans-serif" font-size="12px" fill="#0F6E56" writing-mode="tb" glyph-orientation-vertical="0">持续迭代</text>

  <rect x="40" y="480" width="20" height="12" rx="2" fill="#CECBF6"/>
  <text x="68" y="491" font-family="sans-serif" font-size="12px" fill="#5F5E5A">外部 Agent 操作</text>
  <rect x="180" y="480" width="20" height="12" rx="2" fill="#9FE1CB"/>
  <text x="208" y="491" font-family="sans-serif" font-size="12px" fill="#5F5E5A">内部评估操作</text>
  <line x1="320" y1="486" x2="350" y2="486" stroke="#A32D2D" stroke-width="1.5"/>
  <text x="356" y="491" font-family="sans-serif" font-size="12px" fill="#5F5E5A">拒绝路径</text>
</svg>