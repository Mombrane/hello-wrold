<svg role="img" viewBox="0 0 680 460" width="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>RoPE 实现管线：从输入到 Attention Score 的完整数据流</title>
  <desc>展示 RoPE 在 Transformer Attention 层中的实现路径，包括预计算频率、QK 投影、旋转、Attention 计算四个阶段</desc>

  <rect x="40" y="20" width="600" height="425" rx="16" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>

  <text class="th" x="340" y="50" text-anchor="middle" fill="#2C2C2A" font-family="sans-serif" font-size="14px" font-weight="500">RoPE 实现管线：从 Token 到 Attention Score</text>

  <rect x="60" y="66" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="150" y="88" text-anchor="middle" dominant-baseline="central" fill="#0C447C" font-family="sans-serif" font-size="14px" font-weight="500">输入 x (未感知位置)</text>

  <line x1="240" y1="88" x2="280" y2="88" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="290" y="66" width="180" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="380" y="88" text-anchor="middle" dominant-baseline="central" fill="#3C3489" font-family="sans-serif" font-size="14px" font-weight="500">W_q, W_k 线性投影</text>

  <line x1="470" y1="88" x2="510" y2="88" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="520" y="66" width="100" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="570" y="88" text-anchor="middle" dominant-baseline="central" fill="#085041" font-family="sans-serif" font-size="14px" font-weight="500">q, k 向量</text>

  <rect x="60" y="140" width="560" height="70" rx="10" fill="white" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <rect x="80" y="150" width="250" height="50" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="205" y="170" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-family="sans-serif" font-size="14px" font-weight="500">预计算 cos/sin 缓存</text>
  <text x="205" y="188" text-anchor="middle" dominant-baseline="central" fill="#BA7517" font-family="sans-serif" font-size="12px">inv_freq = 1/theta^(2i/d)</text>

  <line x1="350" y1="175" x2="390" y2="175" stroke="#EF9F27" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="400" y="150" width="200" height="50" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
  <text x="500" y="170" text-anchor="middle" dominant-baseline="central" fill="#854F0B" font-family="sans-serif" font-size="14px" font-weight="500">cos, sin 表 (seq_len x head_dim)</text>
  <text x="500" y="188" text-anchor="middle" dominant-baseline="central" fill="#BA7517" font-family="sans-serif" font-size="12px">惰性扩展, 按设备/dtype 缓存</text>

  <path d="M570 110 L570 150" fill="none" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="280" y="236" width="120" height="44" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="0.5"/>
  <text x="340" y="258" text-anchor="middle" dominant-baseline="central" fill="#712B13" font-family="sans-serif" font-size="14px" font-weight="500">Rotate(q) &amp; Rotate(k)</text>

  <text x="90" y="265" fill="#444441" font-family="sans-serif" font-size="12px">公式: q_rot = q*cos + rotate_half(q)*sin</text>

  <path d="M205 200 L205 258 L280 258" fill="none" stroke="#EF9F27" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M500 200 L500 258 L400 258" fill="none" stroke="#EF9F27" stroke-width="1" marker-end="url(#arrow)"/>

  <line x1="400" y1="258" x2="440" y2="258" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>

  <rect x="450" y="236" width="190" height="44" rx="8" fill="#D3D1C7" stroke="#888780" stroke-width="0.5"/>
  <text x="545" y="258" text-anchor="middle" dominant-baseline="central" fill="#2C2C2A" font-family="sans-serif" font-size="14px" font-weight="500">Attention = softmax(QK^T/sqrt(d))</text>

  <rect x="280" y="306" width="360" height="36" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="460" y="328" text-anchor="middle" dominant-baseline="central" fill="#534AB7" font-family="sans-serif" font-size="12px">关键性质：Q_rot * K_rot^T 仅依赖相对位置 (n-m)，不依赖绝对 m,n</text>

  <rect x="60" y="370" width="560" height="65" rx="10" fill="white" stroke="rgba(0,0,0,0.15)" stroke-width="0.5"/>

  <text x="80" y="394" fill="#3C3489" font-family="sans-serif" font-size="14px" font-weight="500">rotate_half 实现技巧</text>
  <text x="80" y="414" fill="#444441" font-family="sans-serif" font-size="12px">x1 = x[..., :d/2];  x2 = x[..., d/2:];  return cat([-x2, x1], dim=-1)</text>
  <text x="80" y="430" fill="#444441" font-family="sans-serif" font-size="12px">本质：将 (x_{2i}, x_{2i+1}) 每对维度视为 2D 向量，用复数乘法实现旋转，比显式矩阵快 2x</text>

</svg>