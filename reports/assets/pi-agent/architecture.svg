<svg viewBox="0 0 680 520" width="100%" role="img">
  <title>Pi Monorepo 四层架构</title>
  <desc>pi-ai, pi-agent-core, pi-tui, pi-coding-agent 四层分离架构</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="40" y="20" width="600" height="480" rx="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>

  <text x="340" y="55" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Pi Monorepo 四层架构</text>
  <text x="340" y="75" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">由底向上：LLM 抽象 → Agent 运行时 → 终端 UI → 编码 CLI 应用</text>

  <rect x="80" y="100" width="520" height="80" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="100" y="125" font-family="monospace" font-size="13" font-weight="500" fill="#0C447C">pi-ai</text>
  <text x="100" y="145" font-family="sans-serif" font-size="12" fill="#378ADD">统一多供应商 LLM API</text>
  <text x="100" y="165" font-family="sans-serif" font-size="11" fill="#5F5E5A">Anthropic · OpenAI · Google · xAI · Groq · Cerebras · Ollama · OpenRouter 等 15+</text>

  <rect x="80" y="200" width="520" height="80" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="100" y="225" font-family="monospace" font-size="13" font-weight="500" fill="#085041">pi-agent-core</text>
  <text x="100" y="245" font-family="sans-serif" font-size="12" fill="#1D9E75">通用 Agent 运行时（约 1,500 行）</text>
  <text x="100" y="265" font-family="sans-serif" font-size="11" fill="#5F5E5A">工具循环 · 状态管理 · 事件流 · 验证 · 4 工具：read / write / edit / bash</text>

  <rect x="80" y="300" width="520" height="80" rx="10" fill="#FAECE7" stroke="#F0997B" stroke-width="0.5"/>
  <text x="100" y="325" font-family="monospace" font-size="13" font-weight="500" fill="#712B13">pi-tui</text>
  <text x="100" y="345" font-family="sans-serif" font-size="12" fill="#D85A30">终端 UI 渲染库（约 600 行）</text>
  <text x="100" y="365" font-family="sans-serif" font-size="11" fill="#5F5E5A">差分渲染 · 组件系统 · 主题支持 · 零闪烁</text>

  <rect x="80" y="400" width="520" height="80" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="100" y="425" font-family="monospace" font-size="13" font-weight="500" fill="#3C3489">pi-coding-agent</text>
  <text x="100" y="445" font-family="sans-serif" font-size="12" fill="#7F77DD">交互式编码 Agent CLI</text>
  <text x="100" y="465" font-family="sans-serif" font-size="11" fill="#5F5E5A">4 种运行模式：interactive · print/JSON · RPC · SDK (AgentSession)</text>

  <line x1="340" y1="180" x2="340" y2="196" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="280" x2="340" y2="296" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="340" y1="380" x2="340" y2="396" stroke="#888780" stroke-width="1" marker-end="url(#arrow)"/>
</svg>