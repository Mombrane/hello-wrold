<svg viewBox="0 0 680 380" width="100%" role="img">
  <title>Pi vs 同类工具核心维度对比</title>
  <desc>Pi, Claude Code, Codex CLI, Cursor 在工具数量、系统提示词长度、LLM 供应商支持数量三个维度的对比</desc>

  <text x="340" y="35" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">Pi vs 同类工具核心维度对比</text>

  <!-- Legend -->
  <rect x="330" y="55" width="10" height="10" rx="2" fill="#534AB7"/>
  <text x="345" y="64" font-family="sans-serif" font-size="11" fill="#5F5E5A">Pi</text>
  <rect x="385" y="55" width="10" height="10" rx="2" fill="#378ADD"/>
  <text x="400" y="64" font-family="sans-serif" font-size="11" fill="#5F5E5A">Claude Code</text>
  <rect x="475" y="55" width="10" height="10" rx="2" fill="#1D9E75"/>
  <text x="490" y="64" font-family="sans-serif" font-size="11" fill="#5F5E5A">Codex CLI</text>
  <rect x="560" y="55" width="10" height="10" rx="2" fill="#D85A30"/>
  <text x="575" y="64" font-family="sans-serif" font-size="11" fill="#5F5E5A">Cursor</text>

  <!-- Dimension 1: Tool Count (max 25) -->
  <text x="80" y="120" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">内置工具数</text>
  <rect x="80" y="135" width="550" height="24" rx="3" fill="#F1EFE8"/>
  <rect x="80" y="135" width="88" height="24" rx="3" fill="#534AB7"/>
  <text x="98" y="152" font-family="sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">4</text>
  <rect x="80" y="135" width="484" height="24" rx="3" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,4" transform=""/>
  <text x="570" y="152" font-family="sans-serif" font-size="11" fill="#378ADD">22</text>
  <rect x="80" y="135" width="264" height="24" rx="3" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="350" y="152" font-family="sans-serif" font-size="11" fill="#1D9E75">12</text>
  <rect x="80" y="135" width="352" height="24" rx="3" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="438" y="152" font-family="sans-serif" font-size="11" fill="#D85A30">16</text>

  <!-- Dimension 2: System Prompt (max 12k tokens) -->
  <text x="80" y="200" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">系统提示词长度（k tokens）</text>
  <rect x="80" y="215" width="550" height="24" rx="3" fill="#F1EFE8"/>
  <rect x="80" y="215" width="46" height="24" rx="3" fill="#534AB7"/>
  <text x="98" y="232" font-family="sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">&lt;1</text>
  <rect x="80" y="215" width="458" height="24" rx="3" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="545" y="232" font-family="sans-serif" font-size="11" fill="#378ADD">~10</text>
  <rect x="80" y="215" width="229" height="24" rx="3" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="315" y="232" font-family="sans-serif" font-size="11" fill="#1D9E75">~5</text>
  <rect x="80" y="215" width="367" height="24" rx="3" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="453" y="232" font-family="sans-serif" font-size="11" fill="#D85A30">~8</text>

  <!-- Dimension 3: LLM Providers (max 18) -->
  <text x="80" y="280" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">LLM 供应商支持数量</text>
  <rect x="80" y="295" width="550" height="24" rx="3" fill="#F1EFE8"/>
  <rect x="80" y="295" width="458" height="24" rx="3" fill="#534AB7"/>
  <text x="545" y="312" font-family="sans-serif" font-size="11" font-weight="500" fill="#FFFFFF">15+</text>
  <rect x="80" y="295" width="31" height="24" rx="3" fill="none" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="115" y="312" font-family="sans-serif" font-size="11" fill="#378ADD">1</text>
  <rect x="80" y="295" width="31" height="24" rx="3" fill="none" stroke="#1D9E75" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="140" y="312" font-family="sans-serif" font-size="11" fill="#1D9E75">1</text>
  <rect x="80" y="295" width="183" height="24" rx="3" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="270" y="312" font-family="sans-serif" font-size="11" fill="#D85A30">6</text>

  <!-- Insight note -->
  <text x="80" y="355" font-family="sans-serif" font-size="11" fill="#5F5E5A">注：Pi 是唯一在"少工具 + 短提示词 + 多模型"三个维度上同时走相反方向的产品——前两项极低，第三项极高。</text>
</svg>