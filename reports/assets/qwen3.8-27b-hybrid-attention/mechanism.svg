<svg viewBox="0 0 680 240" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <title>Gated DeltaNet 记忆管理机制</title>
  <desc>门控 α 全局遗忘，delta 规则 β 精准覆写，两者共用固定大小的记忆状态 S</desc>
  <text x="40" y="26" font-size="15" font-weight="500" fill="#2C2C2A" font-family="var(--font-sans)">Gated DeltaNet：橡皮擦 + 铅笔的记忆管理</text>
  <rect x="60" y="44" width="200" height="34" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="160" y="61" font-size="13" font-weight="500" fill="#854F0B" text-anchor="middle" font-family="var(--font-sans)">α 门控 · 全局遗忘（橡皮擦）</text>
  <rect x="420" y="44" width="200" height="34" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="520" y="61" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" font-family="var(--font-sans)">β delta 规则 · 精准写入（铅笔）</text>
  <line x1="160" y1="78" x2="348" y2="98" stroke="#BA7517" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="500" y1="78" x2="362" y2="142" stroke="#185FA5" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="40" y="124" width="110" height="36" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="95" y="142" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="var(--font-sans)">输入 k_t, v_t</text>
  <line x1="150" y1="142" x2="252" y2="142" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="260" y="100" width="200" height="90" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="360" y="118" font-size="13" font-weight="500" fill="#26215C" text-anchor="middle" font-family="var(--font-sans)">记忆状态 S（固定大小）</text>
  <rect x="278" y="130" width="40" height="44" rx="4" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <rect x="332" y="130" width="40" height="44" rx="4" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
  <rect x="386" y="130" width="40" height="44" rx="4" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <line x1="360" y1="190" x2="360" y2="212" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="360" y="230" font-size="12" fill="#2C2C2A" text-anchor="middle" font-family="var(--font-sans)">输出 o_t = S · q_t</text>
</svg>
