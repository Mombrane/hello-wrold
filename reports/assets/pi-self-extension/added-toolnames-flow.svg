<svg viewBox="0 0 680 380" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <title>addedToolNames 运行时工具注入链路</title>
  <desc>工具执行后对比激活工具集差异，新增工具名经消息持久化后由 provider 延迟加载注入下一轮</desc>
  <defs>
    <marker id="arrowB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-size="15" font-weight="500" fill="#444441">运行时注入链路：agent 本轮获得新工具，下一轮即可调用</text>
  <g>
    <rect x="60" y="60" width="560" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="78" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">① 扩展工具执行后（wrapper.ts L22-34）</text>
    <text x="340" y="96" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">对比执行前后 active tools，把新增工具名写入 result.addedToolNames</text>
  </g>
  <path d="M340 114 L340 134" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <g>
    <rect x="60" y="136" width="560" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">② ToolResultMessage 持久化（agent-loop.ts L796）</text>
    <text x="340" y="172" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">标记"从这个 transcript 位置起，这些工具可用"</text>
  </g>
  <path d="M340 190 L340 210" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <g>
    <rect x="60" y="212" width="560" height="52" rx="10" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="230" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#04342C">③ provider 适配器消费（openai L315 / anthropic L1150）</text>
    <text x="340" y="248" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">native deferred tool loading 注入新工具</text>
  </g>
  <path d="M340 266 L340 286" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowB)"/>
  <g>
    <rect x="60" y="288" width="560" height="52" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">④ 下一轮 LLM 直接调用新工具</text>
    <text x="340" y="324" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">迟到的工具不进入已缓存 prompt 前缀，缓存命中率不受影响</text>
  </g>
</svg>
