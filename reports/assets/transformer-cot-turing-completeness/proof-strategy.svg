<svg viewBox="0 0 680 460" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Feng et al. 2023 证明策略全景图</title>
  <desc>双线证明结构：不可能性证明（无CoT，左侧橙）和构造性证明（有CoT，右侧绿），以电路复杂度框架TC0/NC1为共同基础</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="32" text-anchor="middle" style="font-size:15px;fill:#2C2C2A;font-weight:500;font-family:sans-serif">证明策略：双线并行，统一于电路复杂度框架</text>
  <rect x="130" y="52" width="420" height="40" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="72" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#3C3489;font-weight:500;font-family:sans-serif">公共基础：电路复杂度 TC0（并行） vs NC1（串行），TC0 ≠ NC1</text>
  <rect x="130" y="110" width="420" height="40" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="130" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#0C447C;font-weight:500;font-family:sans-serif">算术求值 / 线性方程 → NC1-完全（本质串行，需可变深度电路）</text>
  <path d="M340 150 L340 172" stroke="#888780" stroke-width="0.5" fill="none"/>
  <rect x="80" y="176" width="220" height="32" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="190" y="192" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#712B13;font-weight:500;font-family:sans-serif">定理 3.1/3.2：不可能性</text>
  <rect x="380" y="176" width="220" height="32" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="490" y="192" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#085041;font-weight:500;font-family:sans-serif">定理 3.3/3.4：构造性</text>
  <rect x="80" y="220" width="220" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="190" y="240" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#712B13;font-family:sans-serif">Transformer ∈ TC0（常数深度）</text>
  <rect x="380" y="220" width="220" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="490" y="240" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#085041;font-family:sans-serif">手工构建基本操作"指令集"</text>
  <path d="M190 260 L190 280" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 260 L490 280" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="80" y="282" width="220" height="40" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="190" y="302" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#712B13;font-family:sans-serif">TC0 ≠ NC1 矛盾</text>
  <rect x="380" y="282" width="220" height="40" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="490" y="302" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#085041;font-family:sans-serif">组合为推理步骤（5层/步）</text>
  <path d="M190 322 L190 342" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <path d="M490 322 L490 342" stroke="#888780" stroke-width="0.5" fill="none" marker-end="url(#arrow)"/>
  <rect x="80" y="344" width="220" height="40" rx="8" fill="#FCEBEB" stroke="#791F1F" stroke-width="0.5"/>
  <text x="190" y="364" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#501313;font-weight:500;font-family:sans-serif">模型须超多项式增长</text>
  <rect x="380" y="344" width="220" height="40" rx="8" fill="#EAF3DE" stroke="#27500A" stroke-width="0.5"/>
  <text x="490" y="364" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:#173404;font-weight:500;font-family:sans-serif">自回归 = 无限步，可求解</text>
  <rect x="100" y="410" width="480" height="36" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="428" text-anchor="middle" dominant-baseline="central" style="font-size:11px;fill:#3C3489;font-weight:500;font-family:sans-serif">推广：DP 通用框架（定理 4.7）覆盖 LCS、Edit Distance、CFG Membership ��</text>
</svg>
