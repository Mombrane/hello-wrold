<svg viewBox="0 0 680 430" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <title>minimal-pi 架构分层</title>
  <desc>用户提示进入单循环主循环，内部调用 LLM 接入与工具注册表，消息持久化到 JSONL 会话文件</desc>
  <defs>
    <marker id="arrowM1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-size="15" font-weight="500" fill="#444441">minimal-pi 架构：单循环核心 + 三件套（LLM 接入 / 工具注册表 / 会话持久化）</text>
  <g>
    <rect x="240" y="58" width="200" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="80" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">用户 prompt</text>
  </g>
  <path d="M340 104 L340 128" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowM1)"/>
  <g>
    <rect x="60" y="130" width="560" height="96" rx="14" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="154" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#04342C">run_loop 主循环（单 while 循环）</text>
    <text x="340" y="178" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">请求 LLM（非流式）→ 有工具调用? → 执行 → 结果回灌 → 回到请求</text>
    <text x="340" y="198" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#085041">MAX_TURNS=30 防死循环 · 历史裁剪防爆窗 · 每轮消息即时落盘</text>
  </g>
  <path d="M200 228 L200 256" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowM1)"/>
  <path d="M480 228 L480 256" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowM1)"/>
  <g>
    <rect x="60" y="258" width="250" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="185" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">call_llm（模型接入）</text>
    <text x="185" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">≈ Pi 的 StreamFn · OpenAI 兼容</text>
  </g>
  <g>
    <rect x="370" y="258" width="250" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="495" y="278" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">TOOLS 注册表（四工具）</text>
    <text x="495" y="298" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">read / write / edit / bash</text>
  </g>
  <path d="M340 316 L340 344" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowM1)"/>
  <g>
    <rect x="60" y="346" width="560" height="56" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="340" y="366" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#633806">sessions/*.jsonl 会话持久化</text>
    <text x="340" y="386" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">system/user/assistant/tool 全量消息 · 同终端自动继承（TERM_SESSION_ID）</text>
  </g>
</svg>
