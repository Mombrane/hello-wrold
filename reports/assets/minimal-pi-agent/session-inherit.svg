<svg viewBox="0 0 680 360" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--font-sans)">
  <title>同终端继承与跨终端隔离</title>
  <desc>同一终端标签页内运行自动继承历史会话，不同终端按命名空间隔离互不干扰</desc>
  <defs>
    <marker id="arrowM3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="40" y="36" font-size="15" font-weight="500" fill="#444441">会话继承：同终端续聊，跨终端隔离（TERM_SESSION_ID 命名空间）</text>
  <g>
    <rect x="60" y="56" width="280" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="200" y="74" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">终端 A（TERM_SESSION_ID=a）</text>
    <text x="200" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Run 1 → Run 2 → Run 3 自动续聊</text>
  </g>
  <g>
    <rect x="370" y="56" width="280" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="510" y="74" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#085041">终端 B（TERM_SESSION_ID=b）</text>
    <text x="510" y="94" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">独立会话，与 A 互不干扰</text>
  </g>
  <path d="M200 110 L200 130" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowM3)"/>
  <path d="M510 110 L510 130" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowM3)"/>
  <g>
    <rect x="60" y="132" width="280" height="76" rx="12" fill="#9FE1CB" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="200" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#04342C">session-a-20260820-221009.jsonl</text>
    <text x="200" y="174" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">记住暗号 → 重启后继续答出</text>
    <text x="200" y="192" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#085041">--new 可随时开新会话</text>
  </g>
  <g>
    <rect x="370" y="132" width="280" height="76" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
    <text x="510" y="154" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="500" fill="#633806">session-b-20260820-223105.jsonl</text>
    <text x="510" y="174" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">不同标签页 = 不同命名空间</text>
    <text x="510" y="192" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#854F0B">-r 可跨终端查看/恢复</text>
  </g>
  <g>
    <rect x="60" y="240" width="560" height="84" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="340" y="262" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#444441">无 TERM_SESSION_ID 的终端（VS Code 等）→ 回退 "default" 全局续聊</text>
    <text x="340" y="284" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">可用 MCPI_TERM_ID 环境变量自定义命名空间</text>
    <text x="340" y="304" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">默认行为 = 继承；显式 --new 或 -r 覆盖</text>
  </g>
</svg>
