<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640">
  <defs>
    <filter id="s1" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="640" fill="#ffffff"/>
  <text x="480" y="48" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">四层记忆模型</text>

  <!-- Layer 1: user -->
  <rect x="100" y="80" width="760" height="110" rx="12" fill="#7b8cff" opacity="0.12" filter="url(#s1)"/>
  <rect x="100" y="80" width="6" height="110" rx="3" fill="#7b8cff"/>
  <circle cx="150" cy="135" r="24" fill="#7b8cff" opacity="0.25"/>
  <text x="150" y="142" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#7b8cff">U</text>
  <text x="200" y="115" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">user</text>
  <text x="200" y="140" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">这个用户是谁？</text>
  <text x="200" y="162" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">角色、目标、知识背景</text>
  <rect x="760" y="110" width="70" height="26" rx="13" fill="#7b8cff" opacity="0.2"/>
  <text x="795" y="128" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a1a2e">always private</text>

  <!-- Layer 2: feedback -->
  <rect x="100" y="210" width="760" height="110" rx="12" fill="#4361ee" opacity="0.10" filter="url(#s1)"/>
  <rect x="100" y="210" width="6" height="110" rx="3" fill="#4361ee"/>
  <circle cx="150" cy="265" r="24" fill="#4361ee" opacity="0.25"/>
  <text x="150" y="272" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#4361ee">F</text>
  <text x="200" y="245" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">feedback</text>
  <text x="200" y="270" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">我以后该怎么做？</text>
  <text x="200" y="292" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">纠正 + 确认 / 规则 + Why + How to apply</text>
  <rect x="760" y="240" width="70" height="26" rx="13" fill="#4361ee" opacity="0.15"/>
  <text x="795" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a1a2e">default private</text>

  <!-- Layer 3: project -->
  <rect x="100" y="340" width="760" height="110" rx="12" fill="#2d3a8c" opacity="0.10" filter="url(#s1)"/>
  <rect x="100" y="340" width="6" height="110" rx="3" fill="#2d3a8c"/>
  <circle cx="150" cy="395" r="24" fill="#2d3a8c" opacity="0.25"/>
  <text x="150" y="402" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#2d3a8c">P</text>
  <text x="200" y="375" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">project</text>
  <text x="200" y="400" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">项目处在什么现实语境里？</text>
  <text x="200" y="422" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">截止日期、动机、事故 / 快速衰减 / 绝对时间</text>
  <rect x="760" y="370" width="70" height="26" rx="13" fill="#2d3a8c" opacity="0.15"/>
  <text x="795" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a1a2e">bias team</text>

  <!-- Layer 4: reference -->
  <rect x="100" y="470" width="760" height="110" rx="12" fill="#1a1a2e" opacity="0.08" filter="url(#s1)"/>
  <rect x="100" y="470" width="6" height="110" rx="3" fill="#1a1a2e"/>
  <circle cx="150" cy="525" r="24" fill="#1a1a2e" opacity="0.20"/>
  <text x="150" y="532" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">R</text>
  <text x="200" y="505" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">reference</text>
  <text x="200" y="530" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#6b7280">去哪找外部信息？</text>
  <text x="200" y="552" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">URL、项目名、频道名 / 存指针不存内容</text>
  <rect x="760" y="500" width="70" height="26" rx="13" fill="#1a1a2e" opacity="0.12"/>
  <text x="795" y="518" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#1a1a2e">usually team</text>

  <!-- Bottom -->
  <text x="480" y="618" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">四种类型硬编码不可扩展 / memoryTypes.ts 第 14-19 行</text>
</svg>