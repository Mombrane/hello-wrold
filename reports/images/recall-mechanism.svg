<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560">
  <defs>
    <marker id="a3" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4361ee"/>
    </marker>
    <filter id="s3" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="560" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">二阶段召回机制</text>

  <!-- Stage 1 -->
  <rect x="50" y="75" width="380" height="390" rx="12" fill="#4361ee" opacity="0.05" filter="url(#s3)"/>
  <rect x="50" y="75" width="380" height="5" rx="2" fill="#4361ee" opacity="0.35"/>
  <text x="240" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#4361ee">阶段一：扫描</text>
  <text x="240" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">scanMemoryFiles / memoryScan.ts</text>

  <rect x="80" y="155" width="320" height="45" rx="6" fill="#4361ee" opacity="0.08"/>
  <text x="240" y="178" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a2e">memory/ 目录下所有 .md</text>
  <text x="240" y="195" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">排除 MEMORY.md（已通过索引加载）</text>

  <rect x="80" y="215" width="320" height="80" rx="6" fill="#ffffff" stroke="#4361ee" stroke-width="1.5"/>
  <text x="240" y="243" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a2e">并行读取前 30 行</text>
  <text x="240" y="263" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">解析 YAML frontmatter</text>
  <text x="240" y="283" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">filename / description / type / mtimeMs</text>

  <rect x="80" y="310" width="320" height="50" rx="6" fill="#4361ee" opacity="0.10"/>
  <text x="240" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a2e">按 mtime 降序 / 截取前 200 个</text>
  <text x="240" y="350" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">MemoryHeader[] manifest</text>

  <!-- Funnel shape -->
  <polygon points="200,385 280,385 260,420 220,420" fill="#4361ee" opacity="0.15"/>
  <polygon points="210,420 270,420 255,450 225,450" fill="#4361ee" opacity="0.25"/>
  <text x="240" y="445" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">轻量 / 只读 frontmatter</text>

  <!-- Arrow -->
  <line x1="440" y1="270" x2="530" y2="270" stroke="#4361ee" stroke-width="2.5" marker-end="url(#a3)"/>
  <text x="485" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">manifest</text>

  <!-- Stage 2 -->
  <rect x="530" y="75" width="380" height="390" rx="12" fill="#7b8cff" opacity="0.05" filter="url(#s3)"/>
  <rect x="530" y="75" width="380" height="5" rx="2" fill="#7b8cff" opacity="0.35"/>
  <text x="720" y="110" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#7b8cff">阶段二：选择</text>
  <text x="720" y="132" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">selectRelevantMemories / findRelevantMemories.ts</text>

  <rect x="560" y="155" width="320" height="100" rx="6" fill="#ffffff" stroke="#7b8cff" stroke-width="1.5"/>
  <text x="720" y="183" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">Sonnet sideQuery</text>
  <text x="720" y="205" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">输入: query + manifest + 最近工具</text>
  <text x="720" y="225" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">max_tokens: 256 / 强制 JSON 输出</text>
  <text x="720" y="245" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7b8cff">独立调用 / 不消耗主对话 context</text>

  <rect x="560" y="275" width="320" height="70" rx="6" fill="#4361ee" opacity="0.06"/>
  <text x="720" y="298" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#1a1a2e">过滤规则</text>
  <text x="720" y="316" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">排除: 活跃工具的 API 文档（已是噪声）</text>
  <text x="720" y="333" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">保留: warnings / gotchas / 已知问题</text>

  <rect x="560" y="365" width="320" height="55" rx="6" fill="#7b8cff" opacity="0.10"/>
  <text x="720" y="390" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a2e">输出: 最多 5 个文件名</text>
  <text x="720" y="410" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">selected_memories: ["user_role.md", ...]</text>

  <!-- Bottom -->
  <rect x="150" y="490" width="660" height="50" rx="8" fill="#1a1a2e" opacity="0.04"/>
  <text x="480" y="512" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a1a2e">已浮现去重: 前几轮展示过的自动过滤 / alreadySurfaced 参数</text>
  <text x="480" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#1a1a2e">漂移验证: 使用前 ls/grep 核实 / 冲突则信任当前观察并更新记忆</text>
</svg>