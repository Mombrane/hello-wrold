<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600">
  <defs>
    <marker id="a1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4361ee"/>
    </marker>
    <marker id="a2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b8cff"/>
    </marker>
    <filter id="s2" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="480" y="42" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">双路径写入机制</text>

  <!-- Main Agent -->
  <rect x="60" y="75" width="260" height="130" rx="12" fill="#4361ee" opacity="0.10" filter="url(#s2)"/>
  <rect x="60" y="75" width="6" height="130" rx="3" fill="#4361ee"/>
  <text x="90" y="115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#4361ee">Main Agent</text>
  <text x="90" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">对话中主动判断</text>
  <text x="90" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">直接调用 Write 工具</text>
  <text x="90" y="185" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">buildMemoryPrompt()</text>

  <!-- Background Extractor -->
  <rect x="640" y="75" width="260" height="130" rx="12" fill="#7b8cff" opacity="0.10" filter="url(#s2)"/>
  <rect x="640" y="75" width="6" height="130" rx="3" fill="#7b8cff"/>
  <text x="670" y="115" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7b8cff">Background Extractor</text>
  <text x="670" y="140" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">每轮 query 后自动触发</text>
  <text x="670" y="160" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">max 5 turn / 只读 + 记忆目录写</text>
  <text x="670" y="185" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7b8cff">extractMemories.ts</text>

  <!-- Arrows -->
  <line x1="210" y1="210" x2="380" y2="330" stroke="#4361ee" stroke-width="2.5" marker-end="url(#a1)"/>
  <text x="255" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">Step 1: 写 .md 文件</text>
  <line x1="750" y1="210" x2="580" y2="330" stroke="#7b8cff" stroke-width="2.5" stroke-dasharray="8,5" marker-end="url(#a2)"/>
  <text x="690" y="260" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#7b8cff">提取 + 写入</text>

  <!-- MEMORY.md center -->
  <rect x="330" y="330" width="300" height="130" rx="12" fill="#1a1a2e" opacity="0.06" filter="url(#s2)"/>
  <rect x="330" y="330" width="300" height="5" rx="2" fill="#1a1a2e" opacity="0.25"/>
  <text x="480" y="370" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">MEMORY.md</text>
  <text x="480" y="395" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#6b7280">索引文件 + 独立 .md 记忆文件</text>
  <text x="480" y="418" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">Step 2: - [Title](file.md) - one-line hook</text>
  <text x="480" y="440" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">每行 ~150 字符 / 总行 &lt;=200 / 总量 &lt;=25KB</text>

  <!-- Mutex -->
  <rect x="405" y="500" width="150" height="45" rx="22" fill="#4361ee" opacity="0.12"/>
  <text x="480" y="529" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#4361ee">互斥</text>
  <text x="480" y="575" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">主代理已写入 - 后台代理跳过此轮</text>
  <text x="480" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">hasMemoryWritesSince() / extractMemories.ts 第 121-148 行</text>
</svg>