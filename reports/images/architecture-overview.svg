<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="580" viewBox="0 0 960 580">
  <defs>
    <marker id="a4" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#4361ee"/>
    </marker>
    <marker id="a5" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7b8cff"/>
    </marker>
    <filter id="s5" x="-3%" y="-3%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="960" height="580" fill="#ffffff"/>
  <text x="480" y="40" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#1a1a2e">Claude Code 记忆系统架构总览</text>

  <!-- WRITE PATH label -->
  <text x="180" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#4361ee">写入路径</text>

  <!-- Main Agent -->
  <rect x="50" y="95" width="220" height="80" rx="10" fill="#4361ee" opacity="0.10" filter="url(#s5)"/>
  <rect x="50" y="95" width="5" height="80" rx="2" fill="#4361ee"/>
  <text x="80" y="130" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">主代理</text>
  <text x="80" y="152" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">对话中直写 / 两步流程</text>

  <!-- Background Agent -->
  <rect x="50" y="200" width="220" height="80" rx="10" fill="#7b8cff" opacity="0.10" filter="url(#s5)"/>
  <rect x="50" y="200" width="5" height="80" rx="2" fill="#7b8cff"/>
  <text x="80" y="235" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">后台提取代理</text>
  <text x="80" y="257" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">每轮后自动 / max 5 turn</text>

  <!-- Mutex -->
  <rect x="80" y="300" width="160" height="40" rx="20" fill="#4361ee" opacity="0.10"/>
  <text x="160" y="326" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#4361ee">互斥</text>

  <!-- Arrows to center -->
  <line x1="270" y1="135" x2="400" y2="225" stroke="#4361ee" stroke-width="2.5" marker-end="url(#a4)"/>
  <line x1="270" y1="240" x2="400" y2="255" stroke="#7b8cff" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#a5)"/>

  <!-- CENTER: MEMORY.md -->
  <rect x="400" y="175" width="240" height="160" rx="14" fill="#1a1a2e" opacity="0.05" filter="url(#s5)"/>
  <rect x="400" y="175" width="240" height="5" rx="2" fill="#1a1a2e" opacity="0.25"/>
  <text x="520" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#1a1a2e">MEMORY.md</text>
  <text x="520" y="240" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">索引文件 / &lt;=200行 / &lt;=25KB</text>
  <text x="520" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#6b7280">+ 独立 .md 记忆文件</text>
  <text x="520" y="280" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">&lt;=200个文件 / YAML frontmatter</text>
  <text x="520" y="315" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#4361ee">user / feedback / project / reference</text>

  <!-- READ PATH label -->
  <text x="780" y="78" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#7b8cff">召回路径</text>

  <!-- Index injection -->
  <line x1="640" y1="215" x2="720" y2="135" stroke="#4361ee" stroke-width="2.5" marker-end="url(#a4)"/>
  <rect x="720" y="95" width="200" height="80" rx="10" fill="#4361ee" opacity="0.10" filter="url(#s5)"/>
  <text x="820" y="130" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">索引注入</text>
  <text x="820" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">每次对话 / system prompt</text>

  <!-- Sonnet selector -->
  <line x1="640" y1="265" x2="720" y2="245" stroke="#7b8cff" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#a5)"/>
  <rect x="720" y="200" width="200" height="80" rx="10" fill="#7b8cff" opacity="0.10" filter="url(#s5)"/>
  <text x="820" y="235" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">Sonnet 选择器</text>
  <text x="820" y="257" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">每次 query / 最多选 5 个</text>

  <!-- Context window -->
  <line x1="820" y1="175" x2="820" y2="360" stroke="#4361ee" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="720" y="360" width="200" height="55" rx="10" fill="#4361ee" opacity="0.06"/>
  <text x="820" y="388" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a2e">Context Window</text>
  <text x="820" y="405" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">注入主对话上下文</text>

  <!-- Drift verification -->
  <line x1="520" y1="335" x2="520" y2="420" stroke="#1a1a2e" stroke-width="1.5" stroke-dasharray="4,3"/>
  <rect x="350" y="420" width="340" height="65" rx="10" fill="#1a1a2e" opacity="0.05" filter="url(#s5)"/>
  <text x="520" y="448" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#1a1a2e">漂移验证</text>
  <text x="520" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">使用前: ls/grep 核实 / 冲突则信任当前观察</text>

  <!-- Bottom -->
  <text x="480" y="530" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1a1a2e">核心洞察: 代码可以被工具实时检索，但人的意图、偏好和决策动机不行</text>
  <text x="480" y="558" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#6b7280">memdir/memdir.ts / services/extractMemories/extractMemories.ts / memdir/findRelevantMemories.ts</text>
</svg>